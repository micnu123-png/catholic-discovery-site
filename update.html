<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <title>Faith Lantern | Website Updating</title>

  <link
    rel="icon"
    type="image/png"
    href="logo.png"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #7b1113;
      --gold: #d4af37;
      --dark: #090909;
      --dark-card: #151515;
      --text: #ffffff;
      --muted: #bdbdbd;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(
          circle at top,
          #351416 0%,
          var(--dark) 55%
        );
      color: var(--text);
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      text-align: center;
      padding: 24px;
    }

    .update-container {
      width: 100%;
      max-width: 650px;
    }

    .logo {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin-bottom: 25px;
    }

    .fallback-logo {
      width: 100px;
      height: 100px;
      margin: 0 auto 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--gold);
      border-radius: 50%;
      color: var(--gold);
      font-size: 32px;
      font-weight: bold;
    }

    .icon {
      font-size: 52px;
      margin-bottom: 20px;
    }

    .eyebrow {
      color: var(--gold);
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(32px, 7vw, 56px);
      line-height: 1.1;
      margin-bottom: 20px;
    }

    .message {
      color: var(--muted);
      font-size: 18px;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .card {
      background: rgba(21, 21, 21, 0.85);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 18px;
      padding: 28px;
      margin-top: 25px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    .loader {
      width: 55px;
      height: 55px;
      margin: 0 auto 20px;
      border: 4px solid rgba(255, 255, 255, 0.12);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .status {
      color: var(--gold);
      font-weight: bold;
      margin-bottom: 10px;
    }

    .footer {
      margin-top: 35px;
      color: #777;
      font-size: 14px;
    }

    .cross {
      color: var(--gold);
      margin-right: 5px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 600px) {
      .card {
        padding: 22px;
      }

      .message {
        font-size: 16px;
      }
    }
  </style>
</head>


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Faith Lantern — Updating</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #0d1020;
      color: white;
      text-align: center;
    }

    .card {
      width: min(680px, 100%);
      padding: 48px 30px;
      border-radius: 24px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
    }

    .logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
    }

    h1 {
      margin-top: 20px;
    }

    p {
      line-height: 1.7;
      color: #d7d9e5;
    }

    .loader {
      width: 42px;
      height: 42px;
      margin: 28px auto 0;
      border: 4px solid rgba(255,255,255,.18);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <img
      class="logo"
      src="logo.png"
      alt="Faith Lantern"
    >

    <div style="font-size:46px;">
      ✝
    </div>

    <h1>
      Faith Lantern is being updated
    </h1>

    <p>
      We're currently working on the website
      to make your experience better.
    </p>

    <p>
      Please check back shortly.
      God bless you.
    </p>

    <div class="loader"></div>

  </main>

</body>
</html>
